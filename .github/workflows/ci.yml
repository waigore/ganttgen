name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Rebuild ganttgen.py and check drift
        run: |
          python build.py
          git diff --exit-code -- ganttgen.py

      - name: Run tests with coverage
        run: pytest
