# GanttGen project configuration (defaults: config.toml next to ganttgen.py)

title = "Stored Procedure Delivery Plan"
milestone_align = "implement"   # "implement" | "test" (used by schedule_mode = "align")
# compress = ASAP from project_start across all milestones (default).
# align = pack per milestone and pin last SP to the milestone date.
schedule_mode = "compress"   # "compress" | "align"
project_start = 2026-09-01   # required for compress

# Monday=0 … Sunday=6 — HK general holidays treat Sunday as weekly rest;
# gazetted Saturdays are listed under [[holidays]].
weekends = [6]

[milestones]
M1 = 2026-11-30
M2 = 2026-12-16
M3 = 2027-01-18
M4 = 2027-02-17

[sizing.S]
design = 1
implement = 1
test = 1

[sizing.M]
design = 3
implement = 3
test = 3

[sizing.L]
design = 5
implement = 5
test = 5

[teams.design]
label = "Design"
color = "#3d6b8c"
capacity = 1

[teams.implement]
label = "Implement"
color = "#c4783a"
capacity = 3

[teams.test]
label = "Test"
color = "#4a7c59"
capacity = 3

